# Single entry point for the dev environment (http://localhost:8080). Proxy rules only.
#   /api/  -> Fastify container (compose service "fastify"), with the /api prefix stripped
#   /      -> frontend dev server running on the host (port 3001), including the HMR websocket

# Forward "Connection: upgrade" only when the client asked for an upgrade (websocket),
# otherwise let nginx keep the upstream connection reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # The trailing slash on proxy_pass replaces the matched "/api/" prefix:
    # /api/health -> http://fastify:3000/health
    location /api/ {
        proxy_pass http://fastify:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # host.docker.internal is the host machine; compose maps it with
    # extra_hosts: host.docker.internal:host-gateway so it resolves on any platform.
    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        # Frontend contract: the dev server sees the original host (localhost:8080).
        proxy_set_header Host $http_host;
        # HMR websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep an idle HMR websocket open (the default 60s read timeout would drop it).
        proxy_read_timeout 1h;
    }
}
